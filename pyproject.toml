[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "desk-resumer"
version = "0.1.0"
description = "Autonomous task resumer & cooldown supervisor for AI Desktop IDEs (ChatGPT/Codex & Antigravity)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "DeskResumer Contributors" }
]
dependencies = [
    "pyyaml>=6.0",
    "psutil>=5.9.0",
    "rich>=13.0.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
windows = [
    "pywinauto>=0.6.8",
]
macos = [
    "pyobjc-framework-ApplicationServices>=9.0; platform_system=='Darwin'",
]
dev = [
    "pytest>=7.0",
    "black>=23.0",
]

[project.scripts]
desk-resumer = "desk_resumer.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["desk_resumer*"]
