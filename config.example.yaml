# DeskResumer Configuration

# Monitoring settings
monitoring:
  # Target applications to monitor: "chatgpt", "antigravity", or "all"
  target_apps: "all"
  
  # How often to check app window status (in seconds)
  poll_interval_seconds: 30
  
  # Additional buffer time added to the parsed reset time (in seconds)
  # Quota counters often have 1-2 minutes clock drift on server side
  safety_buffer_seconds: 120

# Resumption prompt behavior
resumption:
  # Fallback message injected if not running in Queue/Checklist mode
  default_prompt: "Continue working on the task from where you left off."
  
  # Delay (in seconds) between focusing the window and typing the prompt
  focus_delay_seconds: 1.5

# Sleep prevention (Keep-Awake)
power:
  # Whether to prevent laptop sleep during cooldowns
  prevent_sleep: true
  
  # If false, allows display to turn off while keeping CPU & disk running
  keep_display_on: false

# Remote alerts & notifications
notifications:
  enabled: true
  
  # Option 1: ntfy.sh (Zero account needed, free push notifications to phone)
  # 1. Download the free 'ntfy' app on iOS or Android (or visit https://ntfy.sh in your browser)
  # 2. Subscribe to any unique topic name (e.g., 'desk-resumer-naqib-alerts')
  # 3. Enter that topic name below:
  ntfy:
    topic: ""

  # Option 2: Discord Webhook
  discord:
    webhook_url: ""
    
  # Option 3: Telegram Bot
  telegram:
    bot_token: ""
    chat_id: ""
